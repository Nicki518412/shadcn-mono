# 一键启动：docker compose up -d --build
# - web: http://localhost:5173（nginx 静态 + /api 反代）
# - api: http://localhost:3001
# - SQLite 数据持久化到 db-data 卷；首次启动自动建表 + 种子（admin / Admin@123）
# - 生产部署请设置环境变量 JWT_SECRET（至少 32 字符随机串）
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime-api
    environment:
      DATABASE_URL: "file:/app/data/shard.db"
      # 占位值仅用于演示；生产必须替换为至少 32 字符的随机密钥
      JWT_SECRET: "${JWT_SECRET:-change-me-in-prod-please-use-32-chars}"
      AUTH_PROVIDER: "local"
      NODE_ENV: "production"
      PORT: "3001"
    volumes:
      - db-data:/app/data
    ports:
      - "3001:3001"

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime-web
    depends_on:
      - api
    ports:
      - "5173:80"

volumes:
  db-data:
