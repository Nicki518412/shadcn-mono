name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22
  DATABASE_URL: file:./dev.db
  TEST_DATABASE_URL: file:./test.db
  HUSKY: "0"

jobs:
  quality:
    name: Test, build and lint
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify generated API artifacts
        run: |
          pnpm --filter @repo/db generate
          pnpm --filter @repo/api generate:openapi
          pnpm --filter @repo/api generate:types
          git diff --exit-code -- apps/api/openapi.json apps/web/src/api/schema.d.ts

      - name: Lint
        run: pnpm turbo lint && pnpm lint:e2e

      - name: Typecheck E2E
        run: pnpm typecheck:e2e

      - name: Test
        run: pnpm turbo test

      - name: Build
        run: pnpm turbo build
